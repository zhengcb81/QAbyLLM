<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业竞争力分析仪表板 - 现代版</title>
    
    <!-- 现代化的图表库和图标 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --dark: #1f2937;
            --light: #f8fafc;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1800px;  /* 增加最大宽度以更好利用宽屏 */
            margin: 0 auto;
            padding: 20px;
            width: 95%;  /* 使用更多屏幕空间 */
        }

        /* 现代化导航栏 */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }

        /* 文件上传区域 */
        .upload-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 16px;
        }

        /* 统计卡片网格 - 改进版 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));  /* 增加最小宽度 */
            gap: 24px;  /* 增加间距 */
            margin-bottom: 32px;
        }
        
        /* 在超宽屏上限制最大列数 */
        @media (min-width: 1600px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);  /* 最多4列 */
            }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .stat-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .stat-change {
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-change.positive {
            color: var(--success);
        }

        .stat-change.negative {
            color: var(--danger);
        }

        /* 图表布局 - 改进版 */
        .charts-grid {
            display: grid;
            grid-template-columns: 3fr 2fr;  /* 调整比例，给雷达图更多空间 */
            gap: 24px;
            margin-bottom: 24px;
        }
        
        @media (max-width: 1200px) {
            .charts-grid {
                grid-template-columns: 1fr;  /* 小屏幕时垂直排列 */
            }
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .chart-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
        }

        /* 热力图容器 - 改进版 */
        .heatmap-container {
            grid-column: 1 / -1;
            min-height: 600px;  /* 增加最小高度 */
        }

        .heatmap-wrapper {
            height: 600px;  /* 增加高度以更好显示数据 */
            min-height: 500px;
        }
        
        /* 热力图响应式调整 */
        @media (max-width: 768px) {
            .heatmap-wrapper {
                height: 400px;
            }
        }

        /* 数据表格 */
        .data-table-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-top: 16px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .data-table th,
        .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            background: var(--light);
            font-weight: 600;
            color: var(--dark);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .data-table tr:hover {
            background: rgba(37, 99, 235, 0.05);
        }

        .company-name {
            font-weight: 600;
            color: var(--primary);
        }

        .score-cell {
            text-align: center;
            font-weight: 500;
        }

        .score-high {
            color: var(--success);
        }

        .score-medium {
            color: var(--warning);
        }

        .score-low {
            color: var(--danger);
        }

        /* 加载状态 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            flex-direction: column;
            gap: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #6b7280;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* 通知样式 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: var(--shadow-lg);
        }

        .notification.success {
            background: var(--success);
        }

        .notification.error {
            background: var(--danger);
        }

        .notification.info {
            background: var(--primary);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .navbar {
                flex-direction: column;
                gap: 16px;
            }
            
            .navbar-actions {
                width: 100%;
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 工具提示 */
        .tooltip {
            position: relative;
            cursor: help;
        }

        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            white-space: nowrap;
            z-index: 1000;
            margin-bottom: 8px;
        }

        .tooltip:hover::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-top-color: var(--dark);
            z-index: 1000;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 现代化导航栏 -->
        <nav class="navbar">
            <h1><i class="fas fa-chart-line"></i> 企业竞争力分析仪表板</h1>
            <div class="navbar-actions">
                <button class="btn btn-secondary" onclick="exportData()">
                    <i class="fas fa-download"></i> 导出数据
                </button>
                <button class="btn btn-primary" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i> 刷新数据
                </button>
            </div>
        </nav>

        <!-- 文件上传区域 -->
        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <h3>拖拽JSON文件到此处或点击上传</h3>
                <p>支持多公司分析数据文件 (.json)</p>
                <input type="file" id="fileInput" accept=".json" style="display: none;" multiple>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-folder-open"></i> 选择文件
                </button>
            </div>
        </section>

        <!-- 统计卡片 -->
        <section class="stats-grid" id="statsGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>正在加载数据...</p>
            </div>
        </section>

        <!-- 图表区域 -->
        <section class="charts-grid">
            <div class="chart-container">
                <div class="chart-header">
                    <h3 class="chart-title">
                        <i class="fas fa-radar-chart"></i> 竞争力雷达图
                    </h3>
                    <div class="tooltip" data-tooltip="显示各维度竞争力对比">
                        <i class="fas fa-info-circle"></i>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-header">
                    <h3 class="chart-title">
                        <i class="fas fa-trophy"></i> 公司排名
                    </h3>
                </div>
                <div class="chart-wrapper">
                    <canvas id="rankingChart"></canvas>
                </div>
            </div>
        </section>

        <!-- 热力图 -->
        <section class="chart-container heatmap-container">
            <div class="chart-header">
                <h3 class="chart-title">
                    <i class="fas fa-th"></i> 竞争力热力图
                </h3>
                <div class="tooltip" data-tooltip="颜色越深表示竞争力越强">
                    <i class="fas fa-info-circle"></i>
                </div>
            </div>
            <div class="heatmap-wrapper">
                <div id="heatmapChart" style="height: 100%;"></div>
            </div>
        </section>

        <!-- 数据表格 -->
        <section class="data-table-container">
            <div class="chart-header">
                <h3 class="chart-title">
                    <i class="fas fa-table"></i> 详细数据表
                </h3>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary" onclick="toggleTableView()">
                        <i class="fas fa-eye"></i> 切换视图
                    </button>
                    <button class="btn btn-secondary" onclick="exportTableData()">
                        <i class="fas fa-file-csv"></i> 导出CSV
                    </button>
                </div>
            </div>
            <div class="table-wrapper">
                <table class="data-table" id="dataTable">
                    <thead id="tableHeader">
                        <!-- 动态生成表头 -->
                    </thead>
                    <tbody id="tableBody">
                        <!-- 动态生成表格内容 -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // 全局变量
        let analysisData = {};
        let charts = {};

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeEventListeners();
            loadDefaultData();
        });

        function initializeEventListeners() {
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('uploadArea');

            fileInput.addEventListener('change', handleFileSelect);
            uploadArea.addEventListener('dragover', handleDragOver);
            uploadArea.addEventListener('drop', handleDrop);
            uploadArea.addEventListener('click', () => fileInput.click());
        }

        function handleFileSelect(event) {
            const files = event.target.files;
            if (files.length > 0) {
                loadDataFromFiles(files);
            }
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('dragover');
        }

        function handleDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('dragover');
            
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                loadDataFromFiles(files);
            }
        }

        async function loadDataFromFiles(files) {
            try {
                showLoading();
                
                const filePromises = Array.from(files).map(file => {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = e => {
                            try {
                                resolve(JSON.parse(e.target.result));
                            } catch (error) {
                                reject(new Error(`文件 ${file.name} 格式错误`));
                            }
                        };
                        reader.onerror = () => reject(new Error(`无法读取文件 ${file.name}`));
                        reader.readAsText(file);
                    });
                });

                const dataArray = await Promise.all(filePromises);
                analysisData = mergeAnalysisData(dataArray);
                
                updateDashboard();
                showNotification('数据加载成功！', 'success');
            } catch (error) {
                console.error('文件加载失败:', error);
                showNotification(error.message || '文件加载失败，请检查文件格式', 'error');
                showEmptyState();
            }
        }

        function mergeAnalysisData(dataArray) {
            const merged = {
                companies: {},
                analysis_time: new Date().toISOString(),
                total_companies: 0
            };

            dataArray.forEach(data => {
                if (data.company) {
                    merged.companies[data.company] = data;
                } else if (data.companies) {
                    Object.assign(merged.companies, data.companies);
                } else {
                    // 单个公司数据
                    const companyName = Object.keys(data)[0] || 'Unknown';
                    merged.companies[companyName] = data;
                }
            });

            merged.total_companies = Object.keys(merged.companies).length;
            return merged;
        }

        async function loadDefaultData() {
            try {
                showLoading();
                
                const response = await fetch('multi_company_analysis.json');
                if (response.ok) {
                    const data = await response.json();
                    analysisData = data;
                    updateDashboard();
                } else {
                    // 尝试加载单个公司数据
                    const singleResponse = await fetch('rag_analysis_海康威视.json');
                    if (singleResponse.ok) {
                        const singleData = await singleResponse.json();
                        analysisData = {
                            companies: { '海康威视': singleData },
                            total_companies: 1,
                            analysis_time: new Date().toISOString()
                        };
                        updateDashboard();
                    } else {
                        showEmptyState();
                    }
                }
            } catch (error) {
                console.error('加载默认数据失败:', error);
                showEmptyState();
            }
        }

        function showLoading() {
            document.getElementById('statsGrid').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在加载数据...</p>
                </div>
            `;
        }

        function updateDashboard() {
            updateStatsCards();
            updateCharts();
            updateDataTable();
        }

        function updateStatsCards() {
            const statsGrid = document.getElementById('statsGrid');
            const companies = analysisData.companies || {};
            const companyCount = Object.keys(companies).length;

            if (companyCount === 0) {
                showEmptyState();
                return;
            }

            const stats = calculateStats(companies);
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">分析公司数量</span>
                        <div class="stat-icon">
                            <i class="fas fa-building"></i>
                        </div>
                    </div>
                    <div class="stat-value">${companyCount}</div>
                    <div class="stat-change positive">
                        <i class="fas fa-check-circle"></i> 数据完整
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">平均竞争力</span>
                        <div class="stat-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                    </div>
                    <div class="stat-value">${stats.averageScore.toFixed(1)}</div>
                    <div class="stat-change ${stats.trend > 0 ? 'positive' : 'negative'}">
                        <i class="fas fa-arrow-${stats.trend > 0 ? 'up' : 'down'}"></i> 
                        ${Math.abs(stats.trend).toFixed(1)}% 趋势
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">最强维度</span>
                        <div class="stat-icon">
                            <i class="fas fa-trophy"></i>
                        </div>
                    </div>
                    <div class="stat-value" style="font-size: 1.5rem;">${stats.strongestDimension}</div>
                    <div class="stat-change positive">
                        <i class="fas fa-star"></i> 优势领域
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">分析维度</span>
                        <div class="stat-icon">
                            <i class="fas fa-cube"></i>
                        </div>
                    </div>
                    <div class="stat-value">${stats.dimensionCount}</div>
                    <div class="stat-change positive">
                        <i class="fas fa-check"></i> 全面分析
                    </div>
                </div>
            `;
        }

        function calculateStats(companies) {
            const allScores = [];
            const dimensionScores = {};
            let dimensionCount = 0;

            Object.values(companies).forEach(company => {
                if (company.dimensions) {
                    Object.entries(company.dimensions).forEach(([dim, data]) => {
                        if (data.extracted_data && data.extracted_data.评分) {
                            const score = parseFloat(data.extracted_data.评分);
                            if (!isNaN(score)) {
                                allScores.push(score);
                                
                                if (!dimensionScores[dim]) {
                                    dimensionScores[dim] = [];
                                }
                                dimensionScores[dim].push(score);
                            }
                        }
                    });
                    dimensionCount = Math.max(dimensionCount, Object.keys(company.dimensions).length);
                }
            });

            const averageScore = allScores.length > 0 ? 
                allScores.reduce((a, b) => a + b, 0) / allScores.length : 0;

            let strongestDimension = '未知';
            let highestAvg = 0;
            
            Object.entries(dimensionScores).forEach(([dim, scores]) => {
                const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
                if (avg > highestAvg) {
                    highestAvg = avg;
                    strongestDimension = dim;
                }
            });

            return {
                averageScore,
                strongestDimension,
                dimensionCount,
                trend: (Math.random() - 0.5) * 10 // 模拟趋势
            };
        }

        function updateCharts() {
            updateRadarChart();
            updateRankingChart();
            updateHeatmapChart();
        }

        function updateRadarChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            
            if (charts.radar) {
                charts.radar.destroy();
            }

            const companies = analysisData.companies || {};
            const datasets = [];
            const labels = [];

            // 获取所有维度标签
            Object.values(companies).forEach(company => {
                if (company.dimensions) {
                    Object.keys(company.dimensions).forEach(dim => {
                        if (!labels.includes(dim)) {
                            labels.push(dim);
                        }
                    });
                }
            });

            // 为每个公司创建数据集
            const colors = [
                'rgba(37, 99, 235, 0.6)',
                'rgba(124, 58, 237, 0.6)',
                'rgba(5, 150, 105, 0.6)',
                'rgba(217, 119, 6, 0.6)',
                'rgba(220, 38, 38, 0.6)'
            ];

            Object.entries(companies).forEach(([companyName, company], index) => {
                const data = labels.map(label => {
                    const dimension = company.dimensions?.[label];
                    const score = dimension?.extracted_data?.评分;
                    return score ? parseFloat(score) : 0;
                });

                datasets.push({
                    label: companyName,
                    data: data,
                    backgroundColor: colors[index % colors.length],
                    borderColor: colors[index % colors.length].replace('0.6', '1'),
                    borderWidth: 2,
                    pointBackgroundColor: colors[index % colors.length].replace('0.6', '1'),
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2
                });
            });

            charts.radar = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 10,
                            ticks: {
                                stepSize: 2,
                                color: '#6b7280'
                            },
                            grid: {
                                color: '#e5e7eb'
                            },
                            angleLines: {
                                color: '#e5e7eb'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true
                            }
                        }
                    }
                }
            });
        }

        function updateRankingChart() {
            const ctx = document.getElementById('rankingChart').getContext('2d');
            
            if (charts.ranking) {
                charts.ranking.destroy();
            }

            const companies = analysisData.companies || {};
            const rankings = [];

            Object.entries(companies).forEach(([name, company]) => {
                let totalScore = 0;
                let dimensionCount = 0;

                if (company.dimensions) {
                    Object.values(company.dimensions).forEach(dimension => {
                        if (dimension.extracted_data?.评分) {
                            const score = parseFloat(dimension.extracted_data.评分);
                            if (!isNaN(score)) {
                                totalScore += score;
                                dimensionCount++;
                            }
                        }
                    });
                }

                const averageScore = dimensionCount > 0 ? totalScore / dimensionCount : 0;
                rankings.push({ name, score: averageScore });
            });

            rankings.sort((a, b) => b.score - a.score);

            const backgroundColors = rankings.map((_, index) => {
                const colors = ['#2563eb', '#7c3aed', '#059669', '#d97706', '#dc2626'];
                return colors[index % colors.length];
            });

            charts.ranking = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: rankings.map(r => r.name),
                    datasets: [{
                        label: '综合竞争力',
                        data: rankings.map(r => r.score),
                        backgroundColor: backgroundColors,
                        borderColor: backgroundColors.map(color => color.replace('0.8', '1')),
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 10,
                            grid: {
                                color: '#e5e7eb'
                            },
                            ticks: {
                                color: '#6b7280'
                            }
                        },
                        y: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#6b7280'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function updateHeatmapChart() {
            const companies = analysisData.companies || {};
            const heatmapData = [];
            const companyNames = Object.keys(companies);
            const dimensions = [];

            // 收集所有维度
            Object.values(companies).forEach(company => {
                if (company.dimensions) {
                    Object.keys(company.dimensions).forEach(dim => {
                        if (!dimensions.includes(dim)) {
                            dimensions.push(dim);
                        }
                    });
                }
            });

            // 构建热力图数据
            companyNames.forEach((companyName, i) => {
                dimensions.forEach((dimension, j) => {
                    const score = companies[companyName].dimensions?.[dimension]?.extracted_data?.评分;
                    const numericScore = score ? parseFloat(score) : 0;
                    heatmapData.push([j, i, numericScore]);
                });
            });

            const option = {
                tooltip: {
                    position: 'top',
                    formatter: function(params) {
                        return `${companyNames[params.data[1]]}<br/>${dimensions[params.data[0]]}: ${params.data[2].toFixed(1)}分`;
                    }
                },
                grid: {
                    height: '70%',
                    top: '10%',
                    left: '15%',
                    right: '10%'
                },
                xAxis: {
                    type: 'category',
                    data: dimensions,
                    splitArea: {
                        show: true
                    },
                    axisLabel: {
                        rotate: 45,
                        color: '#6b7280'
                    }
                },
                yAxis: {
                    type: 'category',
                    data: companyNames,
                    splitArea: {
                        show: true
                    },
                    axisLabel: {
                        color: '#6b7280'
                    }
                },
                visualMap: {
                    min: 0,
                    max: 10,
                    calculable: true,
                    orient: 'horizontal',
                    left: 'center',
                    bottom: '5%',
                    inRange: {
                        color: [
                            '#fee2e2', '#fecaca', '#fca5a5', '#f87171', 
                            '#ef4444', '#dc2626', '#b91c1c', '#991b1b',
                            '#7f1d1d', '#450a0a'
                        ]
                    },
                    textStyle: {
                        color: '#374151',
                        fontSize: 12
                    },
                    itemWidth: 20,
                    itemHeight: 140,
                    text: ['高', '低'],
                    textGap: 10
                },
                series: [{
                    name: '竞争力评分',
                    type: 'heatmap',
                    data: heatmapData,
                    label: {
                        show: true,
                        formatter: '{c}',
                        color: '#1f2937'
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            };

            const heatmapChart = echarts.init(document.getElementById('heatmapChart'));
            heatmapChart.setOption(option);
            
            // 响应式调整
            window.addEventListener('resize', () => {
                heatmapChart.resize();
            });
        }

        function updateDataTable() {
            const companies = analysisData.companies || {};
            const tableHeader = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');

            if (Object.keys(companies).length === 0) {
                tableHeader.innerHTML = '';
                tableBody.innerHTML = '<tr><td colspan="100%" class="empty-state">暂无数据</td></tr>';
                return;
            }

            // 获取所有维度
            const dimensions = new Set();
            Object.values(companies).forEach(company => {
                if (company.dimensions) {
                    Object.keys(company.dimensions).forEach(dim => dimensions.add(dim));
                }
            });

            const dimensionArray = Array.from(dimensions);

            // 生成表头
            tableHeader.innerHTML = `
                <tr>
                    <th>公司名称</th>
                    ${dimensionArray.map(dim => `<th>${dim}</th>`).join('')}
                    <th>平均分</th>
                </tr>
            `;

            // 生成表格内容
            const rows = Object.entries(companies).map(([companyName, company]) => {
                const scores = dimensionArray.map(dim => {
                    const score = company.dimensions?.[dim]?.extracted_data?.评分;
                    return score ? parseFloat(score) : 0;
                });

                const average = scores.length > 0 ? 
                    (scores.reduce((a, b) => a + b, 0) / scores.length) : 0;

                const getScoreClass = (score) => {
                    if (score >= 8) return 'score-high';
                    if (score >= 6) return 'score-medium';
                    return 'score-low';
                };

                return `
                    <tr>
                        <td class="company-name">${companyName}</td>
                        ${scores.map(score => 
                            `<td class="score-cell ${getScoreClass(score)}">${score.toFixed(1)}</td>`
                        ).join('')}
                        <td class="score-cell ${getScoreClass(average)}"><strong>${average.toFixed(1)}</strong></td>
                    </tr>
                `;
            }).join('');

            tableBody.innerHTML = rows;
        }

        function showEmptyState() {
            document.getElementById('statsGrid').innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <i class="fas fa-chart-bar"></i>
                    <h3>暂无分析数据</h3>
                    <p>请上传JSON分析文件或运行分析程序生成数据</p>
                </div>
            `;
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                ${message}
            `;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // 工具函数
        function refreshData() {
            loadDefaultData();
            showNotification('数据已刷新', 'success');
        }

        function exportData() {
            if (Object.keys(analysisData).length === 0) {
                showNotification('暂无数据可导出', 'error');
                return;
            }

            const dataStr = JSON.stringify(analysisData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `企业分析数据_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            
            showNotification('数据导出成功', 'success');
        }

        function exportTableData() {
            if (Object.keys(analysisData.companies || {}).length === 0) {
                showNotification('暂无数据可导出', 'error');
                return;
            }

            const companies = analysisData.companies;
            const dimensions = new Set();
            
            Object.values(companies).forEach(company => {
                if (company.dimensions) {
                    Object.keys(company.dimensions).forEach(dim => dimensions.add(dim));
                }
            });

            const dimensionArray = Array.from(dimensions);
            
            // 构建CSV内容
            let csvContent = '公司名称,' + dimensionArray.join(',') + ',平均分\n';
            
            Object.entries(companies).forEach(([companyName, company]) => {
                const scores = dimensionArray.map(dim => {
                    const score = company.dimensions?.[dim]?.extracted_data?.评分;
                    return score ? parseFloat(score).toFixed(1) : '0.0';
                });
                
                const average = scores.length > 0 ? 
                    (scores.reduce((a, b) => parseFloat(a) + parseFloat(b), 0) / scores.length).toFixed(1) : '0.0';
                
                csvContent += `${companyName},${scores.join(',')},${average}\n`;
            });

            const csvBlob = new Blob([csvContent], {type: 'text/csv;charset=utf-8;'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(csvBlob);
            link.download = `企业竞争力数据_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            
            showNotification('CSV数据导出成功', 'success');
        }

        function toggleTableView() {
            const table = document.getElementById('dataTable');
            const isHidden = table.style.display === 'none';
            table.style.display = isHidden ? 'table' : 'none';
            
            const button = event.target.closest('button');
            const icon = button.querySelector('i');
            icon.className = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
        }
    </script>
</body>
